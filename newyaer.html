<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    background:linear-gradient(135deg,#020024,#090979,#00d4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    text-align:center;
    overflow:hidden;
}

.container{
    padding:20px;
    animation:fadeIn 2s ease-in-out;
}

h1{
    font-size:clamp(2.5rem,6vw,4rem);
    margin-bottom:15px;
    animation:glow 1.5s infinite alternate;
}

p{
    font-size:clamp(1.1rem,4vw,1.4rem);
    opacity:0.9;
}

.from{
    margin-top:15px;
    font-size:1.1rem;
    opacity:0.85;
}

button{
    margin-top:25px;
    padding:12px 30px;
    font-size:1rem;
    border:none;
    border-radius:30px;
    background:#ffcc00;
    color:black;
    cursor:pointer;
}

button:hover{
    background:white;
}

/* Animations */
@keyframes glow{
    from{ text-shadow:0 0 10px gold; }
    to{ text-shadow:0 0 30px white; }
}

@keyframes fadeIn{
    from{ opacity:0; transform:scale(0.9); }
    to{ opacity:1; transform:scale(1); }
}

/* Fireworks */
.firework{
    position:absolute;
    width:6px;
    height:6px;
    background:gold;
    border-radius:50%;
    animation:explode 2s infinite;
}

@keyframes explode{
    0%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(18); opacity:0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎆 Happy New Year 2025 🎆</h1>
    <p>May this year bring happiness, success & good health</p>
    <div class="from">— From Jagdish Jivansingh Thakur</div>
    <button onclick="start()">▶ Play Music</button>
</div>

<!-- Fireworks -->
<div class="firework" style="top:20%; left:30%;"></div>
<div class="firework" style="top:50%; left:70%; animation-delay:0.5s;"></div>
<div class="firework" style="top:70%; left:45%; animation-delay:1s;"></div>

<!-- Music -->
<audio id="music" loop>
    <source src="new-year-348947.mp3" type="audio/mpeg">
</audio>

<script>
function start(){
    document.getElementById("music").play();
    openFullscreen();
}

function openFullscreen(){
    let elem=document.documentElement;
    if(elem.requestFullscreen){
        elem.requestFullscreen();
    }else if(elem.webkitRequestFullscreen){
        elem.webkitRequestFullscreen();
    }
}
</script>

</body>
</html>
